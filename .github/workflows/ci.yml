name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Todo push na master publica no Cloudflare (pedido do Gustavo: igual ao gus.meu.financeiro).
  # Só roda se os testes passaram.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Uma publicação nunca é cancelada no meio; pushes seguidos entram na fila.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    # A conta vem do `account_id` do wrangler.jsonc; o token é o único segredo.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # O wrangler não é dependência do projeto: vem pelo npx, preso na versão 4.
      - run: npx --yes wrangler@4 deploy
